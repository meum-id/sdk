# Release pipeline: an annotated vX.Y.Z tag push on main gates, publishes the
# workspace packages to npm, and creates the GitHub Release as its output.
#
# All three jobs are thin callers of shared meum-id/.github reusables: the
# integrity gate (tag on main, version matches package.json), the npm build +
# publish job, and the GitHub Release terminal job. workflow_dispatch re-runs
# the pipeline for an existing tag.
#
# npm-publish.yml is defensive by design: the product scaffolding
# (package.json, workspace packages, build scripts) is added later by another
# agent per the plan. Every publish step guards on the relevant file and
# no-ops with a message when the scaffolding is absent, so a tag push against
# the bare repo is a green no-op.
#
# TODO before first real publish:
#   - Add the NPM_TOKEN secret (npm automation token, publish scope for @meum):
#       `gh secret set NPM_TOKEN --repo meum-id/sdk`
#     or switch to npm Trusted Publishing (OIDC) and set `id-token: write` on
#     the job, dropping NODE_AUTH_TOKEN.
#   - Confirm each package.json carries `"publishConfig": {"access": "public"}`
#     and the correct `"version"` matching the tag.
name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to re-run the release pipeline for
        required: false
        type: string

permissions:
  contents: read

jobs:
  verify:
    uses: meum-id/.github/.github/workflows/verify-release-tag.yml@main
    with:
      tag: ${{ inputs.tag || github.ref_name }}

  publish:
    needs: verify
    uses: meum-id/.github/.github/workflows/npm-publish.yml@main
    with:
      tag: ${{ inputs.tag || github.ref_name }}
    secrets:
      # TODO: add the NPM_TOKEN secret (see header). Publish 401s without it.
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  github-release:
    needs: publish
    uses: meum-id/.github/.github/workflows/create-github-release.yml@main
    permissions:
      contents: write
    with:
      tag: ${{ inputs.tag || github.ref_name }}
