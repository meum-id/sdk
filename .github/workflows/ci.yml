# CI for the Bun + Biome + TypeScript monorepo: install, lint, typecheck, test.
#
# The test suite includes the @meum/sdk bundle-size gate (<50KB gzipped) and
# the Miniflare smoke test for the mock Worker.
#
# Not wired as a required status check yet. Once the checks report, add the
# `ci / Lint, typecheck, test` context to .github/rulesets/protect-main.json.
name: CI

on:
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  ci:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (Biome)
        run: bun run lint

      - name: Typecheck (tsc)
        run: bun run typecheck

      - name: Test
        run: bun test
