# CI for the Bun + Biome + TypeScript monorepo: install, lint, typecheck, test.
#
# The test suite includes the @meum/sdk bundle-size gate (<50KB gzipped) and
# the Miniflare smoke test for the mock Worker. The shared meum-id/.github
# bun-ci.yml reusable runs the actual steps; this caller only carries the
# event trigger, concurrency, and permissions (GitHub mechanics that must stay
# on the caller).
#
# Not wired as a required status check yet. Once the checks report, add the
# `ci / lint, typecheck, test` context to .github/rulesets/protect-main.json.
name: CI

on:
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: meum-id/.github/.github/workflows/bun-ci.yml@main
