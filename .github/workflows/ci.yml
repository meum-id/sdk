# CI skeleton for the Bun + Biome + TypeScript monorepo.
#
# Defensive by design: the product scaffolding (package.json, biome.json,
# tsconfig, workspace packages) is added later by another agent per the plan.
# Every build step guards on `package.json` and no-ops with a message when the
# scaffolding is absent, so this workflow is green on the bare repo and starts
# doing real work the moment the build lands.
#
# Not wired as a required status check while it is a skeleton. Connect the
# `bun run lint` / `bun run typecheck` scripts in package.json, confirm the
# checks report, then add the `ci / Lint, typecheck, test` context to
# .github/rulesets/protect-main.json.
name: CI

on:
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  ci:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: |
          if [ -f package.json ]; then
            bun install --frozen-lockfile
          else
            echo "scaffolding not present yet (no package.json); skipping install"
          fi

      - name: Lint (Biome)
        run: |
          if [ -f package.json ]; then
            bun run lint
          else
            echo "scaffolding not present yet (no package.json); skipping lint"
          fi

      - name: Typecheck (tsc)
        run: |
          if [ -f package.json ]; then
            bun run typecheck
          else
            echo "scaffolding not present yet (no package.json); skipping typecheck"
          fi

      - name: Test
        run: |
          if [ -f package.json ]; then
            bun test
          else
            echo "scaffolding not present yet (no package.json); skipping tests"
          fi
