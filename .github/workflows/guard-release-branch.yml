# Caller for the reusable guard-release-branch workflow.
#
# Rejects PRs to main whose head branch doesn't start with `release/`. Keeps
# `dev` off the list of PR heads, which is what makes delete-branch-on-merge
# safe to leave on without risking origin/dev.
#
# Default prefix `release/` is supplied by the reusable workflow; pass
# `with: prefix: <other>` to override.
#
# This repository is public, and GitHub refuses a public repository's call into
# a workflow in a private one, so the caller uses the public copy of the
# reusable, pinned to a commit. The job key must stay `guard-release:` so the
# status check context is `guard-release / check-release-branch-name`.
name: Guard release branch pattern

on:
  pull_request:
    branches: [main]

permissions:
  pull-requests: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  guard-release:
    uses: brettdavies/.github/.github/workflows/guard-release-branch.yml@5f0b2c5aa471e193a696f829fc371ddc46dbaae8 # main as of 2026-10-04
