# Caller for the centralized guard-main-docs reusable workflow.
#
# Blocks engineering docs (docs/plans, docs/solutions, docs/brainstorms,
# docs/reviews, and similar dev-only assets) from being merged into main.
# Only needs pull-requests: read.
#
# The reusable ref is SHA-pinned; the trailing comment records the branch and
# resolution date. Refresh recipe: `gh api repos/brettdavies/.github/commits/main --jq .sha`.
name: Guard main from engineering docs

on:
  pull_request:
    branches: [main]

permissions:
  pull-requests: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  guard-docs:
    uses: brettdavies/.github/.github/workflows/guard-main-docs.yml@c8aaed5b969713355efe6fa2914feb732d91268d # main as of 2026-07-09
    with:
      # Agent learnings and Lighthouse output stay on dev only.
      extra_paths: '**/.agent/,**/.lighthouseci/'
