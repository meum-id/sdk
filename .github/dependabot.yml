# Dependabot configuration.
#
# Two `target-branch: dev` blocks (bun for the Bun workspace package
# dependencies, github-actions for workflow actions) handle version updates:
# weekly on Monday mornings, 7-day cooldown so a just-published version has
# to survive a week before Dependabot proposes it, every minor + patch
# batched into one PR per ecosystem per week. The wildcard `ignore` holds
# majors outright: a major bump (a TypeScript 5.x -> 7.x migration, for
# instance) is a reviewed change, never an automatic PR. The bun block also
# holds every version update of bun-types, which moves only with the Bun
# runtime pinned in .bun-version; a test holds the two together.
#
# The `bun` ecosystem regenerates bun.lock inside each update PR; the `npm`
# ecosystem refuses a project that carries bun.lock.
#
# The bun updater writes bun.lock with the Bun its image bundles, which can
# differ from the repo's pinned Bun, and it cannot read the lockfileVersion 2
# that a from-scratch Bun 1.4 install writes
# (https://github.com/dependabot/dependabot-core/issues/16026). Keep bun.lock
# at lockfileVersion 1. When CI's frozen install rejects a Dependabot lockfile,
# run `bun install` with the pinned Bun on the PR branch and push.
#
# Dependabot opens no security updates for Bun, and its alerts cover only the
# direct dependencies in package.json: the dependency graph does not read
# bun.lock. `bun audit` checks the whole lockfile. Fix an advisory by bumping
# the dependency by hand and running `bun install`.
# https://docs.github.com/en/code-security/dependabot/ecosystems-supported-by-dependabot/supported-ecosystems-and-repositories#bun
#
# `target-branch: dev` is non-negotiable on every block. Without it,
# Dependabot defaults to `main` and the PR fails the dev -> release/* -> main
# flow that guard-release-branch.yml enforces. Dependabot reads this config
# from the default branch, which is main, so an edit here only takes effect
# once it reaches main. Do not flip `target-branch` on a live block:
# retargeting orphans-and-closes any open PR.
#
# The github-actions group uses `patterns` rather than `update-types`: the
# ignore rule already drops majors, so `*` is exactly minor + patch and does
# not depend on Dependabot inferring a SemVer level from a SHA pin's trailing
# comment.
version: 2
updates:
  - package-ecosystem: bun
    directory: "/"
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Chicago
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    labels:
      - dependencies
      - typescript
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
      - dependency-name: "bun-types"
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Chicago
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - github-actions
    groups:
      actions-minor-patch:
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
